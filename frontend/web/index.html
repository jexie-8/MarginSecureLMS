<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Margin LMS secure academic workspace.">
  <meta name="theme-color" content="#0B2039">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Margin LMS">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Margin LMS</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { margin: 0; min-height: 100%; background: #0b2039; }
    #margin-loader { position: fixed; inset: 0; z-index: 9999; display: grid; place-items: center; background: #0b2039; color: #fff; font-family: Inter, Arial, sans-serif; }
    .margin-loader-content { display: flex; flex-direction: column; align-items: center; gap: 24px; }
    .margin-loader-brand { display: flex; align-items: center; gap: 12px; font-size: 22px; font-weight: 700; }
    .margin-loader-mark { width: 56px; height: 48px; object-fit: contain; }
    .margin-loader-line { width: 180px; height: 3px; overflow: hidden; border-radius: 4px; background: rgba(255,255,255,.12); }
    .margin-loader-line::after { content: ''; display: block; width: 45%; height: 100%; background: #55c9be; animation: margin-load 1.2s ease-in-out infinite; }
    .margin-loader-copy { color: #aebecd; font-size: 12px; }
    @keyframes margin-load { from { transform: translateX(-110%); } to { transform: translateX(330%); } }
    @media (prefers-reduced-motion: reduce) { .margin-loader-line::after { animation: none; width: 100%; opacity: .7; } }
  </style>
</head>
<body>
  <div id="margin-loader" role="status" aria-live="polite">
    <div class="margin-loader-content">
      <div class="margin-loader-brand"><img class="margin-loader-mark" src="margin-logo.png" alt=""><span>Margin LMS</span></div>
      <div class="margin-loader-line"></div>
      <div class="margin-loader-copy">Preparing your secure workspace…</div>
    </div>
  </div>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      const loader = document.getElementById('margin-loader');
      if (loader) loader.remove();
    });
  </script>
</body>
</html>
