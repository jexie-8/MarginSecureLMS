<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <!--
    Content-Security-Policy. A static site cannot send HTTP headers, so the
    policy travels in the page. Everything is served from this site; the only
    outside addresses are the API and Google's font host (Flutter downloads
    fallback fonts such as Roboto from fonts.gstatic.com when text needs them).
    Release builds replace the API address below (see scripts/build_web.ps1).
    'wasm-unsafe-eval' is needed by Flutter's CanvasKit renderer to run
    WebAssembly, not for JavaScript eval.
  -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: http://localhost:8000; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' http://localhost:8000 https://fonts.gstatic.com; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="referrer" content="same-origin">

  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Margin LMS secure academic workspace.">
  <meta name="theme-color" content="#0B2039">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Margin LMS">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Margin LMS</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="loader.css">
</head>
<body>
  <div id="margin-loader" role="status" aria-live="polite">
    <div class="margin-loader-content">
      <div class="margin-loader-brand"><img class="margin-loader-mark" src="margin-logo.png" alt=""><span>Margin LMS</span></div>
      <div class="margin-loader-line"></div>
      <div class="margin-loader-copy">Preparing your secure workspace…</div>
    </div>
  </div>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
  <script src="loader.js"></script>
</body>
</html>
