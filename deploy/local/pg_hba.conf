# Who may connect to the database, and how.
#
# - The unix socket inside the container is used only by the container's own
#   health check and first-run setup.
# - Every network connection must use TLS and a password (SCRAM). A connection
#   without TLS is rejected, not downgraded.
local   all   all                      trust
hostssl all   all   all                scram-sha-256
host    all   all   all                reject
