user www-data;
worker_processes auto;
pid /run/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

# One address serves both the Flutter web app (static files) and the Laravel
# API (/api and /sanctum). Same origin means the session cookie is first-party
# and the browser never makes a cross-site request.
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /dev/stdout;
    sendfile on;
    server_tokens off;
    client_max_body_size 50m;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/wasm;

    server {
        listen 8080;
        root /var/www/web;
        index index.html;

        # Only the tunnel (HTTPS) reaches this container, so tell PHP the
        # request was secure. Secure cookies and generated links depend on it.
        set $php_script /var/www/html/public/index.php;

        location ~ ^/(api|sanctum)(/|$) {
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $php_script;
            fastcgi_param SCRIPT_NAME /index.php;
            fastcgi_param HTTPS on;
            fastcgi_param HTTP_PROXY "";
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_read_timeout 60s;
        }

        location = /up {
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $php_script;
            fastcgi_param SCRIPT_NAME /index.php;
            fastcgi_param HTTP_PROXY "";
            fastcgi_pass 127.0.0.1:9000;
        }

        # Security headers for the static site (a meta tag cannot set these).
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;

        location / {
            try_files $uri $uri/ /index.html;
        }

        # The app shell and service worker must never be served stale.
        location ~* ^/(index\.html|flutter_service_worker\.js|flutter_bootstrap\.js|version\.json)$ {
            add_header Cache-Control "no-cache" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy "no-referrer" always;
            add_header Strict-Transport-Security "max-age=31536000" always;
            add_header Content-Security-Policy "frame-ancestors 'none'" always;
            try_files $uri =404;
        }

        location ~ /\. {
            deny all;
        }
    }
}
