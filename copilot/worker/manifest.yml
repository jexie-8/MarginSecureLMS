name: worker
type: Backend Service

image:
  build:
    dockerfile: backend/Dockerfile
    context: backend

command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--timeout=90", "--max-time=3600"]
cpu: 256
memory: 512
count: 1

network:
  vpc:
    placement: private

variables:
  APP_ENV: production
  APP_DEBUG: "false"
  LOG_CHANNEL: stderr
  LOG_LEVEL: warning
  DB_CONNECTION: pgsql
  DB_PORT: "5432"
  DB_SSLMODE: verify-full
  DB_SSLROOTCERT: /etc/ssl/certs/aws-rds-global-bundle.pem
  QUEUE_CONNECTION: database
  MAIL_MAILER: smtp
  MAIL_SCHEME: smtp

secrets:
  APP_KEY: APP_KEY
  APP_URL: APP_URL
  FRONTEND_URL: FRONTEND_URL
  DB_HOST: DB_HOST
  DB_DATABASE: DB_DATABASE
  DB_USERNAME: DB_RUNTIME_USERNAME
  DB_PASSWORD: DB_RUNTIME_PASSWORD
  MAIL_HOST: MAIL_HOST
  MAIL_PORT: MAIL_PORT
  MAIL_USERNAME: MAIL_USERNAME
  MAIL_PASSWORD: MAIL_PASSWORD
  MAIL_FROM_ADDRESS: MAIL_FROM_ADDRESS
