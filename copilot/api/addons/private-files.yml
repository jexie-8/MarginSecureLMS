Parameters:
  App:
    Type: String
  Env:
    Type: String
  Name:
    Type: String

Resources:
  PrivateFilesKey:
    Type: AWS::KMS::Key
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: !Sub "${App}-${Env} private LMS files"
      EnableKeyRotation: true
      PendingWindowInDays: 30

  PrivateFilesKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub "alias/${App}-${Env}-private-files"
      TargetKeyId: !Ref PrivateFilesKey

  PrivateFilesBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms
              KMSMasterKeyID: !GetAtt PrivateFilesKey.Arn
            BucketKeyEnabled: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: RemoveIncompleteUploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
          - Id: RetainPreviousVersions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 90

  RequireTlsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref PrivateFilesBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt PrivateFilesBucket.Arn
              - !Sub "${PrivateFilesBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: "false"

  PrivateFilesAccessPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: ListPrivateFiles
            Effect: Allow
            Action:
              - s3:ListBucket
              - s3:GetBucketLocation
            Resource: !GetAtt PrivateFilesBucket.Arn
          - Sid: ManagePrivateFiles
            Effect: Allow
            Action:
              - s3:DeleteObject
              - s3:GetObject
              - s3:PutObject
            Resource: !Sub "${PrivateFilesBucket.Arn}/*"
          - Sid: UsePrivateFilesKey
            Effect: Allow
            Action:
              - kms:Decrypt
              - kms:Encrypt
              - kms:GenerateDataKey
            Resource: !GetAtt PrivateFilesKey.Arn

Outputs:
  PrivateFilesAccessPolicyArn:
    Value: !Ref PrivateFilesAccessPolicy
  AwsBucket:
    Value: !Ref PrivateFilesBucket
  AwsS3KmsKeyId:
    Value: !GetAtt PrivateFilesKey.Arn
